<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shokoladnye Sirochki Retro Portal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="screen-noise"></div>
    <div class="scanlines"></div>

    <header class="marquee-wrap">
      <p class="marquee">★ SHOKOLADNYE SIROCHKI ★ RETRO Y2K EXPERIENCE ★ CLICK THE ICONS ★</p>
    </header>

    <main class="collage" aria-label="Retro collage desktop">
      <article class="retro-window window-main" data-window>
        <div class="title-bar" data-drag-handle>
          <h1>CHOCO TERMINAL.EXE</h1>
          <div class="controls">
            <button type="button" class="minimize" data-minimize aria-label="Minimize window">_</button>
            <button type="button" class="close" data-close aria-label="Close window">×</button>
          </div>
        </div>
        <div class="window-content">
          <p class="glow-text">WELCOME TO THE SWEETEST CRT FEED ON THE INTERNET.</p>
          <p>Neon glitches, arcade sugar rush, and pixel-powered snacks.</p>
          <button type="button" class="arcade-button" id="audio-toggle">▶ START VHS HUM</button>
        </div>
      </article>

      <article class="retro-window window-links" data-window>
        <div class="title-bar">
          <h2>Desktop Links</h2>
          <div class="controls">
            <button type="button" class="minimize" data-minimize aria-label="Minimize window">_</button>
            <button type="button" class="close" data-close aria-label="Close window">×</button>
          </div>
        </div>
        <div class="window-content icons-grid">
          <a class="desktop-icon" href="#" aria-label="Open Arcade Shop">
            <span>🕹️</span>
            <strong>Arcade Shop</strong>
          </a>
          <a class="desktop-icon" href="#" aria-label="Open VHS Vault">
            <span>📼</span>
            <strong>VHS Vault</strong>
          </a>
          <a class="desktop-icon" href="#" aria-label="Open Neon Chat">
            <span>💾</span>
            <strong>Neon Chat</strong>
          </a>
        </div>
      </article>

      <div class="sticker sticker-pink">NEW!</div>
      <div class="sticker sticker-cyan">Y2K MODE</div>
      <div class="sticker sticker-lime">HI-SCORE</div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
